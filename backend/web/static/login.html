<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朝夕小叮 - 后台管理登录</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">

<div class="login-box">
  <div class="login-icon">⚙️</div>
  <h1 id="loginTitle">后台管理登录</h1>
  <p class="subtitle">管理员专用入口</p>

  <!-- 登录表单 -->
  <form id="loginForm" class="login-form" onsubmit="return false;">
    <div class="form-row">
      <input id="loginPhone" type="text" placeholder="手机号" maxlength="11">
    </div>
    <div class="form-row">
      <input id="loginPassword" type="password" placeholder="密码">
    </div>
    <button class="login-btn btn-primary" onclick="doLogin()">登 录</button>
  </form>

  <!-- 注册表单（管理员） -->
  <form id="registerForm" class="login-form" style="display:none;" onsubmit="return false;">
    <div class="form-row">
      <input id="regPhone" type="text" placeholder="手机号" maxlength="11">
    </div>
    <div class="form-row">
      <input id="regNickname" type="text" placeholder="昵称">
    </div>
    <div class="form-row">
      <input id="regPassword" type="password" placeholder="设置密码（至少6位）">
    </div>
    <button class="login-btn btn-primary" onclick="doRegister()">注 册</button>
  </form>

  <!-- 切换注册/登录 -->
  <p class="login-switch">
    <span id="switchText">还没有管理员账号？</span>
    <a href="javascript:void(0)" id="switchLink" onclick="toggleForm()">去注册</a>
  </p>
</div>

<script src="/static/app.js"></script>
<script>
let isRegister = false;

function toggleForm() {
  isRegister = !isRegister;
  document.getElementById('loginForm').style.display = isRegister ? 'none' : '';
  document.getElementById('registerForm').style.display = isRegister ? '' : 'none';
  document.getElementById('loginTitle').textContent = isRegister ? '注册管理员' : '后台管理登录';
  document.getElementById('switchText').textContent = isRegister ? '已有账号？' : '还没有管理员账号？';
  document.getElementById('switchLink').textContent = isRegister ? '去登录' : '去注册';
}

async function doLogin() {
  const phone = document.getElementById('loginPhone').value.trim();
  const pwd = document.getElementById('loginPassword').value;
  if (!phone || !pwd) { toast('请填写手机号和密码', false); return; }

  const res = await api('/api/v1/auth/login-password', {
    method: 'POST',
    body: JSON.stringify({ phone, password: pwd })
  });

  handleAuthResult(res);
}

async function doRegister() {
  const phone = document.getElementById('regPhone').value.trim();
  const nickname = document.getElementById('regNickname').value.trim();
  const pwd = document.getElementById('regPassword').value;
  if (!phone || !nickname || !pwd) { toast('请填写所有字段', false); return; }
  if (pwd.length < 6) { toast('密码至少6位', false); return; }

  const res = await api('/api/v1/auth/register', {
    method: 'POST',
    body: JSON.stringify({ phone, nickname, password: pwd, role: 3 })
  });

  handleAuthResult(res);
}

function handleAuthResult(res) {
  if (res.code === 0) {
    if (res.data.user.role !== 3) {
      toast('该账号不是管理员，无法登录后台', false);
      return;
    }
    sessionStorage.setItem('token', res.data.access_token);
    sessionStorage.setItem('refreshToken', res.data.refresh_token);
    sessionStorage.setItem('userId', res.data.user.id);
    sessionStorage.setItem('nickname', res.data.user.nickname || '');
    sessionStorage.setItem('role', 'admin');
    toast('登录成功，正在跳转...');
    setTimeout(() => { location.href = '/static/admin.html'; }, 400);
  } else {
    toast(res.message || '操作失败', false);
  }
}
</script>
</body>
</html>
